<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotSoToons</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f2; color: #171717; font-family: "Segoe UI", sans-serif; padding: 24px; }
    main { max-width: 36rem; }
    h1 { font-size: clamp(2.4rem, 8vw, 4.5rem); letter-spacing: -0.045em; margin: 0 0 12px; }
    p { color: #5e5e5e; line-height: 1.5; }
    a { color: #e23b2f; }
  </style>
</head>
<body>
  <main>
    <h1 id="brand">NotSoToons</h1>
    <p id="missing">Esta página no existe. / This page does not exist.</p>
    <p><a id="home" href="/">Volver al inicio / Back to the portfolio</a></p>
  </main>
  <script>
    (function () {
      var host = location.hostname;
      var seg = location.pathname.split("/").filter(Boolean)[0];
      var home = "/";
      if (host.endsWith(".github.io") && seg) home = "/" + seg + "/";
      document.getElementById("home").href = home;
      var lang = (navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en";
      function pick(value) {
        if (!value) return "";
        return (value[lang] || value.en || value.es || "").trim();
      }
      fetch(home + "content/site.json").then(function (res) { return res.json(); }).then(function (site) {
        var ui = site.ui || {};
        var missing = document.getElementById("missing");
        var back = document.getElementById("home");
        if (missing && pick(ui.notFound)) missing.textContent = pick(ui.notFound);
        if (back && pick(ui.notFoundHome)) back.textContent = pick(ui.notFoundHome);
      }).catch(function () {});
      fetch(home + "content/theme.json").then(function (res) { return res.json(); }).then(function (theme) {
        var title = document.getElementById("brand");
        if (title && theme.heroTitle) title.textContent = theme.heroTitle;
      }).catch(function () {});
    })();
  </script>
</body>
</html>
