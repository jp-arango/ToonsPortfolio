# Pages CMS — https://app.pagescms.org
# Cada pieza nueva sale en formato cine (wide, 2.39:1) a todo el ancho.
# Arrastra la lista para cambiar el orden. Las imágenes van a media/.

media:
  input: media
  output: media
  rename: safe
  extensions: [png, jpg, jpeg, gif, webp, avif, svg, mp4, webm]

components:
  i18n-line:
    type: object
    label: ES / EN
    fields:
      - name: es
        label: Español
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true
  i18n-line-optional:
    type: object
    label: ES / EN
    fields:
      - name: es
        label: Español
        type: string
      - name: en
        label: English
        type: string

content:
  - name: site
    label: Sitio
    type: file
    path: content/site.json
    format: json
    fields:
      - name: brand
        label: Nombre
        type: string
        required: true
      - name: credit
        label: Crédito bajo el título
        component: i18n-line
        description: "Línea pequeña. En inglés: by Juan Pablo Arango."
      - name: metaTitle
        label: Título de la pestaña
        component: i18n-line
      - name: metaDescription
        label: Descripción corta
        component: i18n-line
      - name: illustrationTitle
        label: Categoría ilustración
        component: i18n-line
      - name: threedTitle
        label: Categoría 3D
        component: i18n-line
      - name: contactTitle
        label: Pestaña contacto
        component: i18n-line
      - name: email
        label: Correo
        type: string
        description: "Déjalo vacío si todavía no quieres mostrarlo."
      - name: socials
        label: Redes
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{label}"
        fields:
          - name: network
            label: Red
            type: select
            options:
              values:
                - { name: youtube, label: YouTube }
                - { name: instagram, label: Instagram }
                - { name: artstation, label: ArtStation }
                - { name: itch, label: itch.io }
                - { name: x, label: X / Twitter }
                - { name: tiktok, label: TikTok }
                - { name: other, label: Otro / Other }
          - name: label
            label: Nombre visible
            type: string
            required: true
          - name: handle
            label: Usuario
            type: string
          - name: url
            label: URL
            type: string
            required: true
            description: "Tiene que empezar por https://"
      - name: ui
        label: Textos de la interfaz
        type: object
        fields:
          - { name: skip, label: Saltar al contenido, component: i18n-line }
          - { name: menu, label: Menú, component: i18n-line }
          - { name: closeMenu, label: Cerrar menú, component: i18n-line }
          - { name: language, label: Idioma, component: i18n-line }
          - { name: spanish, label: Español, component: i18n-line }
          - { name: english, label: Inglés, component: i18n-line }
          - { name: close, label: Cerrar, component: i18n-line }
          - { name: previous, label: Anterior, component: i18n-line }
          - { name: next, label: Siguiente, component: i18n-line }
          - { name: watch, label: Reproducir, component: i18n-line }
          - { name: emptyIllustration, label: Vacío ilustración, component: i18n-line }
          - { name: emptyThreed, label: Vacío 3D, component: i18n-line }
          - { name: emptyContact, label: Vacío contacto, component: i18n-line }
          - { name: emailCta, label: Botón de correo, component: i18n-line }
          - { name: loadError, label: Error de carga, component: i18n-line }
          - { name: newTab, label: Pestaña nueva, component: i18n-line }

  - name: illustration
    label: Ilustración y animación
    type: file
    path: content/illustration.json
    format: json
    fields:
      - name: items
        label: Piezas
        type: object
        description: "Arrastra para ordenar. Wide es el formato de cine a todo el ancho, y es el tamaño por defecto."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title.es}"
        fields:
          - name: title
            label: Título
            component: i18n-line
            description: "Queda pegado al borde superior de la imagen."
          - name: image
            label: Imagen
            type: image
            description: "JPG, PNG o WebP. Si también hay video, la imagen se usa de póster."
          - name: youtube
            label: YouTube (ID o URL)
            type: string
            description: "Opcional. ID de 11 caracteres o la URL completa."
          - name: videoFile
            label: Archivo de video
            type: file
            description: "Opcional. MP4 o WebM. Si hay YouTube, se usa YouTube."
          - name: size
            label: Tamaño
            type: select
            default: wide
            description: "Wide = cine 2.39:1 a todo el ancho. Es el formato base."
            options:
              values:
                - { name: wide, label: "Wide — cine, todo el ancho" }
                - { name: large, label: Large }
                - { name: medium, label: Medium }
                - { name: small, label: Small }
          - name: alt
            label: Texto alternativo
            component: i18n-line-optional

  - name: threed
    label: 3D y videojuegos
    type: file
    path: content/threed.json
    format: json
    fields:
      - name: items
        label: Piezas
        type: object
        description: "Arrastra para ordenar. Wide es el formato de cine a todo el ancho, y es el tamaño por defecto."
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title.es}"
        fields:
          - name: title
            label: Título
            component: i18n-line
            description: "Queda pegado al borde superior de la imagen."
          - name: image
            label: Imagen
            type: image
            description: "JPG, PNG o WebP. Si también hay video, la imagen se usa de póster."
          - name: youtube
            label: YouTube (ID o URL)
            type: string
            description: "Opcional. ID de 11 caracteres o la URL completa."
          - name: videoFile
            label: Archivo de video
            type: file
            description: "Opcional. MP4 o WebM. Si hay YouTube, se usa YouTube."
          - name: size
            label: Tamaño
            type: select
            default: wide
            description: "Wide = cine 2.39:1 a todo el ancho. Es el formato base."
            options:
              values:
                - { name: wide, label: "Wide — cine, todo el ancho" }
                - { name: large, label: Large }
                - { name: medium, label: Medium }
                - { name: small, label: Small }
          - name: alt
            label: Texto alternativo
            component: i18n-line-optional
